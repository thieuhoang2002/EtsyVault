name: Build & Release EtsyVault

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Publish Single-File Binaries
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore src/EtsyVault.UI/EtsyVault.UI.csproj

    - name: Build Solution
      run: dotnet build src/EtsyVault.UI/EtsyVault.UI.csproj --configuration Release --no-restore

    - name: Publish Windows (win-x64 Self-Contained)
      run: >
        dotnet publish src/EtsyVault.UI/EtsyVault.UI.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o publish/win-x64

    - name: Compress Windows Release
      shell: pwsh
      run: |
        Compress-Archive -Path publish/win-x64/* -DestinationPath EtsyVault-win-x64.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          EtsyVault-win-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
